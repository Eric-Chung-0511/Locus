# =============================================================================
# TEST FIXTURE ONLY: synthetic weather stoppage probabilities, NOT MEASURED DATA.
# Not used by the app (the app reads config/weather_*.yaml). It keeps the engine
# tests independent of real data and covers the legacy format with a fixed wind
# stoppage ('wind' instead of 'wind_exceedance').
#
# These numbers only give the engine a plausible seasonal shape for a west-coast
# Taiwan site (wetter May-Sep, windier Oct-Mar under the north-east monsoon).
# Replace them with values computed from Central Weather Administration (CWA)
# daily station records before drawing any conclusion from the model.
#
# rain: probability that a day is lost for rain-sensitive work
# wind: probability that a day is lost for wind-limited lifting work
# mean_spell_days: average number of CONSECUTIVE lost days, per month and kind.
#   Optional. It regroups the same share of lost days into runs (a two-state
#   Markov chain; see locus/weather.py). It cannot be shorter than 1 / (1 - p),
#   the value for independent days. Illustrative shape: plum rain (May-Jun) and
#   typhoon fronts (Aug-Sep) bring multi-day rain; north-east monsoon surges
#   (Oct-Mar) bring multi-day wind. From CWA daily records it is
#   (number of lost days) / (number of runs of lost days) per month.
# Month order: Jan .. Dec
# =============================================================================

display_name: "Illustrative placeholder (not measured)"
is_illustrative: true
source: "Placeholder shape for model development only"
stations:
  West coast (illustrative):
    rain: [0.10, 0.12, 0.12, 0.12, 0.20, 0.25, 0.15, 0.22, 0.15, 0.06, 0.06, 0.08]
    wind: [0.35, 0.30, 0.25, 0.12, 0.08, 0.06, 0.10, 0.12, 0.15, 0.30, 0.38, 0.40]
    mean_spell_days:
      rain: [1.8, 2.0, 2.0, 2.0, 3.0, 3.5, 1.5, 2.5, 2.5, 1.5, 1.5, 1.8]
      wind: [3.5, 3.0, 2.5, 1.5, 1.3, 1.3, 2.0, 2.5, 2.5, 3.0, 3.5, 4.0]
