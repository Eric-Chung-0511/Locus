# -----------------------------------------------------------------------------
# Common risks (risk drivers). Activity ranges above are drawn independently of
# each other; a common risk is ONE event that, when it occurs in a simulated
# future, moves many items together (Hulett's risk driver method).
#   probability : chance that it occurs in a given future
#   effect      : factor -> multiplies activity durations (working days for
#                           weather-sensitive work)
#                 days   -> adds days to activity durations or external arrivals
#   impact      : size when it occurs (a distribution, like any duration)
#   applies_to  : an item is affected when it matches EVERY selector given;
#                 each selector is a list (ids, groups, conditions, kinds, weather)
# All four are illustrative assumptions (grade C) for the method, not estimates
# for a real project. Keep them out of the activity ranges: a range should say
# how the work varies when no common risk hits it, or the risk counts twice.
# -----------------------------------------------------------------------------
risks:
  - id: SITE_PRODUCTIVITY
    name: "Site productivity below plan (labour market, rework, supervision)"
    short_name: "Site productivity"
    probability: 0.5
    effect: factor
    impact: {dist: triangular, min: 1.0, mode: 1.08, max: 1.25}
    applies_to:
      groups: ["Construction: Turbine Hall", "Construction: HRSG", "Construction: linear assets",
               "Construction: transformer yard", "Balance of plant"]
      conditions: [weather, productivity]
    source: {grade: C, note: "Illustrative: a site-wide productivity shortfall slows all construction work together"}
  - id: COMMISSIONING
    name: "Commissioning slower than planned (system turnover, vendor support)"
    short_name: "Commissioning pace"
    probability: 0.4
    effect: factor
    impact: {dist: triangular, min: 1.0, mode: 1.10, max: 1.35}
    applies_to:
      groups: ["Gate 0: power receipt", "Gate A: condenser vacuum", "Gate B: GT spin", "Gate C: first-fire items"]
      conditions: [productivity]
    source: {grade: C, note: "Illustrative: one commissioning team and one set of vendor specialists serve every system"}
  - id: SUPPLY_CHAIN
    name: "Supply-chain disruption on major equipment (shipping, factory backlog)"
    short_name: "Equipment supply chain"
    probability: 0.25
    effect: days
    impact: {dist: triangular, min: 10, mode: 30, max: 90}
    applies_to:
      ids: [HRSG_MOD_DELIV, GT_DELIV, GEN_DELIV, ST_DELIV, TX_DELIV]
    source: {grade: C, note: "Illustrative: a shipping or factory-capacity disruption delays every major package at once"}
  - id: REVIEW_BACKLOG
    name: "Authority review backlog (staffing, workload peaks)"
    short_name: "Review backlog"
    probability: 0.3
    effect: factor
    impact: {dist: triangular, min: 1.0, mode: 1.3, max: 1.8}
    applies_to:
      conditions: [regulatory]
    source: {grade: C, note: "Illustrative: a backlog at the authorities slows every review and inspection"}

# -----------------------------------------------------------------------------
# Assets: attributes that the rule pack reads to decide which reviews apply.
# -----------------------------------------------------------------------------
assets:
  - id: TH_OHC
    name: "Turbine Hall overhead crane"
    short_name: "Crane"
    type: fixed_crane
    capacity_t: 150
    install_activity: TH_CRANE_INST
    feeds: [GT_ONBASE, GEN_ONBASE, ST_ONBASE]
    group: "Reviews and permits"
    # First principle: the invariant is "lifting capacity available", the crane is one means.
    alt_means:
      target: GT_ONBASE
      pred: TH_STEEL_MAIN
      rel: FS
      lag: 25
      proposal: "Set the GT with a temporary heavy lift"
      cost: "Temporary heavy lift (gantry or jacking) for GT setting; extra contractor cost and a separate lift-plan approval"

  - id: GSU
    name: "Generator step-up transformer and grid connection"
    short_name: "GSU"
    type: hv_equipment
    voltage_kv: 345
    grid_connected: true
    site_test_activity: TX_TEST
    grid_ready_event: SWYD_READY
    downstream: [MV_LV_BACKFEED]
    report_submit_day: 400
    group: "Gate 0: power receipt"

  - id: UNIT_STACK
    name: "Unit stack (gas turbine exhaust)"
    short_name: "Stack"
    type: stationary_emission_source
    first_emission_milestone: FIRST_FIRE
    submission_day: 600
    group: "Reviews and permits"

  - id: SITE_DISCHARGE
    name: "Hydrotest, flushing and cleaning wastewater"
    short_name: "Wastewater"
    type: wastewater_discharge
    group: "Reviews and permits"
