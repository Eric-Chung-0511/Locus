# =============================================================================
# Reference plant: generic single-shaft CCGT (GT - Generator - ST on one shaft,
# HRSG without bypass stack), ONE unit, utility-owned, medium granularity.
#
# This is a fictional reference model built from general engineering practice
# and public sources. It does not describe any real project. All durations are
# illustrative assumptions unless a source grade says otherwise.
#
# Conventions
#   - Time unit: days. Day 0 = site mobilisation / first piling.
#   - Weather-sensitive activities (weather: rain | wind): duration = WORKING days;
#     a day is lost when the day's weather exceeds the stoppage threshold.
#     rain: civil and outdoor work (piling, foundations, tunnels); indoor work
#           continues once the building envelope is closed, so it is not rain-sensitive.
#     wind: wind-limited lifts (steel erection, cladding, pipe rack, HRSG heavy lifts).
#           Wind only WARNS by default; it stops work only under the wind rule the
#           user chooses in the app (threshold, share of windy spells, remobilisation days).
#   - All other activities: duration = CALENDAR days.
#   - Link relations: FS (start after predecessor finishes + lag),
#                     SS (start after predecessor starts + lag). Lag in calendar days.
#   - Link types (first-principles classification):
#       physical    : cannot be broken (cause-and-effect in the physical world)
#       means       : the invariant holds, but the MEANS can be swapped
#       regulatory  : cannot be broken, but preparation can start earlier
#       contractual : negotiable between parties
#       resource    : crew / sequence / practice choice, field can adjust
#       logistics   : space, access, crane stands, haul routes
#   - A link with `relax:` is a candidate for "which links can we break to recover
#     time". `relax` describes the alternative logic, the `proposal` as it is said
#     on site, and what it costs.
#   - Every activity and external input needs a unique `short_name` (max 30
#     characters) used on chart axes; tables and hover text use the full `name`.
#   - Source grades: A = official data / law text, B = industry or public document,
#                    C = explicit assumption or practitioner estimate.
# =============================================================================

meta:
  name: "Reference single-shaft CCGT (generic, 1 unit)"
  owner_type: utility            # utility | ipp  (changes the review path in the rule pack)
  configuration: single_shaft_no_bypass_stack
  milestone: FIRST_FIRE
  default_start_date: "2027-01-04"
  disclaimer: >
    Fictional reference plant built from general practice and public sources.
    Not based on, and not representative of, any specific real project.

groups:
  - "Construction: Turbine Hall"
  - "Construction: HRSG"
  - "Construction: linear assets"
  - "Construction: transformer yard"
  - "Balance of plant"
  - "External inputs"
  - "Gate 0: power receipt"
  - "Gate A: condenser vacuum"
  - "Gate B: GT spin"
  - "Gate C: first-fire items"
  - "Reviews and permits"

# -----------------------------------------------------------------------------
# External inputs (interface nodes). Design, procurement and transport are not
# expanded in v1; each major package is an arrival event with a delay spread.
# The tool back-calculates the latest acceptable arrival for each of them.
# -----------------------------------------------------------------------------
externals:
  - {id: HRSG_MOD_DELIV, name: "HRSG modules on site (first batch)", short_name: "HRSG modules arrive", group: "External inputs",
     planned_day: 230, delay: {dist: triangular, min: 0, mode: 10, max: 45},
     source: {grade: C, note: "Illustrative planned arrival"}}
  - {id: GT_DELIV, name: "Gas turbine on site", short_name: "Gas turbine arrives", group: "External inputs",
     planned_day: 330, delay: {dist: triangular, min: 0, mode: 10, max: 60},
     source: {grade: C, note: "Illustrative planned arrival"}}
  - {id: GEN_DELIV, name: "Generator on site", short_name: "Generator arrives", group: "External inputs",
     planned_day: 330, delay: {dist: triangular, min: 0, mode: 10, max: 60},
     source: {grade: C, note: "Illustrative planned arrival"}}
  - {id: ST_DELIV, name: "Steam turbine and condenser on site", short_name: "ST and condenser arrive", group: "External inputs",
     planned_day: 345, delay: {dist: triangular, min: 0, mode: 10, max: 60},
     source: {grade: C, note: "Illustrative planned arrival"}}
  - {id: TX_DELIV, name: "Step-up transformer on site", short_name: "Step-up transformer arrives", group: "External inputs",
     planned_day: 470, delay: {dist: triangular, min: 0, mode: 15, max: 90},
     source: {grade: B, note: "Long-lead item ordered at project start; industry surveys report roughly 2-3 year lead times for large power transformers"}}
  - {id: SWYD_READY, name: "Grid-side switchyard ready for connection", short_name: "Grid switchyard ready", group: "External inputs",
     planned_day: 540, delay: {dist: triangular, min: 0, mode: 30, max: 150},
     source: {grade: C, note: "Grid-side scope; spread reflects interface uncertainty"}}

